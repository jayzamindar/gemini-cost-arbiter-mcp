apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gemini-cost-arbiter-mcp
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/gemini-cost-arbiter-mcp:latest
          ports:
            - name: http1
              containerPort: 8000
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: REQUIRE_AUTH
              value: "true"
            - name: DEFAULT_MODEL
              value: "gemini-3.8-flash-high"
            - name: THINKING_BUDGET
              value: "2048"
            - name: MAX_OUTPUT_TOKENS
              value: "8192"
            - name: MAX_PAYLOAD_BYTES
              value: "10485760"
            - name: DB_PATH
              value: "/app/data/finops.db"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-api-key
                  key: latest
            - name: PLAN_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: plan-signing-secret
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
