[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-cost-arbiter-mcp"
version = "1.0.0"
description = "Autonomous FinOps intelligence engine and Model Context Protocol (MCP) server powered by Gemini 3.8 Flash High."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Principal AI Systems Engineering Team" }
]
keywords = [
    "finops",
    "cloud-cost",
    "mcp",
    "model-context-protocol",
    "gemini",
    "aws",
    "ec2",
    "rds",
    "s3",
    "ai-agent"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "filelock>=3.16.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "respx>=0.22.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
gemini-cost-arbiter = "gemini_cost_arbiter.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["gemini_cost_arbiter*", "app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
timeout = 10
timeout_method = "thread"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = false
warn_return_any = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
