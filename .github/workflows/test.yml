name: Continuous Integration & Verification Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']

    steps:
    - name: Checkout Source Code Repository
      uses: actions/checkout@v4

    - name: Configure Python ${{ matrix.python-version }} Runtime
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Architecture Dependencies & Package
      run: |
        python -m pip install --upgrade pip
        pip install setuptools
        pip install -e ".[dev,test]"

    - name: Run Ruff Lint Gate
      run: ruff check src tests

    - name: Run Mypy Strict Type Gate
      run: mypy src

    - name: Execute Automated Test Suite with Timeout & Coverage Gate
      env:
        OPENROUTER_API_KEY: "mock_key"
        GEMINI_API_KEY: "test-key"
        ENVIRONMENT: "test"
      run: |
        python -m pytest -q --tb=short --timeout=10 --cov=src/gemini_cost_arbiter --cov-fail-under=90
