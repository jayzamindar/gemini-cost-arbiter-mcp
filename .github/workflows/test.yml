name: Continuous Integration & Verification Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']

    steps:
    - name: Checkout Source Code Repository
      uses: actions/checkout@v4

    - name: Configure Python ${{ matrix.python-version }} Runtime
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Architecture Dependencies & Package
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install setuptools
        pip install -e .

    - name: Execute Full Automated Test Suite
      env:
        OPENROUTER_API_KEY: "mock_ci_token_bypass"
        GEMINI_API_KEY: "mock_ci_token_bypass"
      run: |
        python -m pytest -v
